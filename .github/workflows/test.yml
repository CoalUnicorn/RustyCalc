name: test

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IRON_CANVAS_REF: b898b430d5251982079374bbd2f1a854caada60b

jobs:
  # Native tests run in the separate iron-canvas repository.
  # RustyCalc is a wasm client, so its target check runs in feature-hack.
  test-native:
    name: cargo test (iron-canvas, native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iron-canvas
        uses: actions/checkout@v4
        with:
          repository: CoalUnicorn/iron-canvas
          ref: ${{ env.IRON_CANVAS_REF }}
          path: iron-canvas

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: iron-canvas -> target

      - name: cargo test --workspace
        working-directory: iron-canvas
        run: cargo test --workspace --locked

  # Feature-powerset check via cargo-hack.
  # - host run scopes to iron-canvas/ workspace (rusty-calc is wasm-only)
  # - wasm run checks the RustyCalc package and its canvas dependencies
  feature-hack:
    name: cargo hack (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cmd: cargo hack --feature-powerset --no-dev-deps check --workspace --manifest-path iron-canvas/Cargo.toml --target x86_64-unknown-linux-gnu
          - target: wasm32-unknown-unknown
            cmd: cargo hack --feature-powerset --no-dev-deps check --manifest-path RustyCalc/Cargo.toml --target wasm32-unknown-unknown
    steps:
      - name: Checkout RustyCalc
        uses: actions/checkout@v4
        with:
          path: RustyCalc
          submodules: recursive

      - name: Checkout iron-canvas
        uses: actions/checkout@v4
        with:
          repository: CoalUnicorn/iron-canvas
          ref: ${{ env.IRON_CANVAS_REF }}
          path: iron-canvas

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            RustyCalc -> target
            iron-canvas -> target
          key: hack-${{ matrix.target }}

      - name: ${{ matrix.cmd }}
        run: ${{ matrix.cmd }}
