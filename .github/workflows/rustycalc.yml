name: rustycalc

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IRON_CANVAS_REF: b898b430d5251982079374bbd2f1a854caada60b

jobs:
  build:
    name: fmt + clippy + check (wasm32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RustyCalc
        uses: actions/checkout@v4
        with:
          path: RustyCalc
          submodules: recursive

      - name: Checkout iron-canvas
        uses: actions/checkout@v4
        with:
          repository: CoalUnicorn/iron-canvas
          ref: ${{ env.IRON_CANVAS_REF }}
          path: iron-canvas

      - name: Install Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            RustyCalc -> target
            iron-canvas -> target

      - name: cargo fmt --check
        working-directory: RustyCalc
        run: cargo fmt --check

      # No -D warnings yet; flip on once existing lints are triaged.
      - name: cargo clippy (wasm32)
        working-directory: RustyCalc
        run: cargo clippy --target wasm32-unknown-unknown

      - name: cargo check (wasm32)
        working-directory: RustyCalc
        run: cargo check --target wasm32-unknown-unknown
