name: Deploy to GitHub Pages

# Builds two trunk artifacts on every push to main or dev:
#   main -> /RustyCalc/        (default public_url from Trunk.toml)
#   dev  -> /RustyCalc/dev/    (--public-url override)
# Both trees are combined into a single Pages artifact so one Pages
# deployment hosts both sites. The non-triggering branch is always
# rebuilt (not pulled from a previous artifact) so the deployment is
# coherent regardless of which branch pushed.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main/RustyCalc
          submodules: recursive

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev/RustyCalc
          submodules: recursive

      # Each branch declares its compatible canvas pin in its build workflow.
      - name: Read branch canvas pins
        id: canvas
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import re

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for branch in ("main", "dev"):
                  workflow = pathlib.Path(branch, "RustyCalc/.github/workflows/rustycalc.yml")
                  pins = re.findall(r"^  IRON_CANVAS_REF: ([0-9a-f]{40})$", workflow.read_text(), re.MULTILINE)
                  if len(pins) != 1:
                      raise SystemExit(f"Expected one pinned IRON_CANVAS_REF in {workflow}")
                  output.write(f"{branch}={pins[0]}\n")
          PYTHON

      - name: Checkout main iron-canvas
        uses: actions/checkout@v4
        with:
          repository: CoalUnicorn/iron-canvas
          ref: ${{ steps.canvas.outputs.main }}
          path: main/iron-canvas

      - name: Checkout dev iron-canvas
        uses: actions/checkout@v4
        with:
          repository: CoalUnicorn/iron-canvas
          ref: ${{ steps.canvas.outputs.dev }}
          path: dev/iron-canvas

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            main/RustyCalc/target
            dev/RustyCalc/target
          key: ${{ runner.os }}-pages-${{ hashFiles('main/**/Cargo.lock', 'dev/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-pages-

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build main (/RustyCalc/)
        working-directory: main/RustyCalc
        run: trunk build --release

      - name: Build dev (/RustyCalc/dev/)
        working-directory: dev/RustyCalc
        run: trunk build --release --public-url /RustyCalc/dev/

      - name: Assemble combined Pages tree
        run: |
          mkdir -p pages-dist
          cp -r main/RustyCalc/dist/. pages-dist/
          cp -r dev/RustyCalc/dist     pages-dist/dev

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
