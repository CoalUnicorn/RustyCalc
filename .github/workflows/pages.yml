name: Deploy to GitHub Pages

# Builds two trunk artifacts on every push to main or dev:
#   main -> /RustyCalc/        (default public_url from Trunk.toml)
#   dev  -> /RustyCalc/dev/    (--public-url override)
# Both trees are combined into a single Pages artifact so one Pages
# deployment hosts both sites. The non-triggering branch is always
# rebuilt (not pulled from a previous artifact) so the deployment is
# coherent regardless of which branch pushed.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: RustyCalc-main

      # main still uses path = "../IronCalc/base" (no submodule yet).
      # Remove after dev→main merge when main gets the submodule.
      - name: Checkout IronCalc (sibling for main build)
        uses: actions/checkout@v4
        with:
          repository: CoalUnicorn/IronCalc
          ref: rustycalc-xlsx-wasm
          path: IronCalc

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: RustyCalc-dev
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RustyCalc-main/target
            RustyCalc-dev/target
          key: ${{ runner.os }}-pages-${{ hashFiles('RustyCalc-main/Cargo.lock', 'RustyCalc-dev/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-pages-

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build main (/RustyCalc/)
        working-directory: RustyCalc-main
        run: trunk build --release

      - name: Build dev (/RustyCalc/dev/)
        working-directory: RustyCalc-dev
        run: trunk build --release --public-url /RustyCalc/dev/ --features dev-tools

      - name: Assemble combined Pages tree
        run: |
          mkdir -p pages-dist
          cp -r RustyCalc-main/dist/. pages-dist/
          cp -r RustyCalc-dev/dist     pages-dist/dev

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
