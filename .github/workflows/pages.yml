name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RustyCalc
        uses: actions/checkout@v4
        with:
          path: RustyCalc

      # Cargo.toml uses path = "../IronCalc/base" and "../IronCalc/xlsx".
      # Pin deploys to the fork main; upstream-drift detection lives in rustycalc.yml's cron.
      - name: Checkout IronCalc (sibling required by path deps)
        uses: actions/checkout@v4
        with:
          repository: CoalUnicorn/IronCalc
          ref: main
          path: IronCalc

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RustyCalc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('RustyCalc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build
        working-directory: RustyCalc
        run: trunk build --release

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: RustyCalc/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
