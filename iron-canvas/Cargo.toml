[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-beta.1"
authors = ["CoalUnicorn"]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ironcalc_base = { version = "0.7.1", path = "../../IronCalc/base" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2.11.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
