[package]
  name = "iron-canvas"
  version = "0.1.0-alpha.1"
  edition = "2021"

  [lib]
  crate-type = ["cdylib", "rlib"]

  [dependencies]
  ironcalc_base = { version = "0.7.1", path = "../../IronCalc/base"  }
  wasm-bindgen = "0.2"
  js-sys = "0.3"
  web-sys = { version = "0.3", features = [
      "CanvasRenderingContext2d",
      "HtmlCanvasElement","OffscreenCanvas",
      "TextMetrics",
      "Window","Element", "Document", "CssStyleDeclaration"
  ] }
