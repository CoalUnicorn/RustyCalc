[package]
name = "iron-canvas-canvas2d"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
iron-canvas-core = { path = "../iron-canvas-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement","OffscreenCanvas",
    "TextMetrics",
    "Window","Element", "Document", "CssStyleDeclaration"
] }
