[package]
name = "iron-canvas-web"
version = "0.1.0-alpha.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iron-canvas-core = { path = "../iron-canvas-core" }
ironcalc_base = { version = "0.7.1", path = "../../../../IronCalc/base" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement","OffscreenCanvas",
    "TextMetrics",
    "Window","Element", "Document", "CssStyleDeclaration"
] }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
bitflags = "2.11.1"
