[package]
name = "iron-canvas-web"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dev-tools = [
    "dep:iron-canvas-recorder",
    "dep:serde_json",
    "iron-canvas-core/surface-introspection",
]
pdf = ["iron-canvas-export/pdf"]

[dependencies]
iron-canvas-core = { path = "../iron-canvas-core" }
iron-canvas-export = { path = "../iron-canvas-export", default-features = true }
iron-canvas-recorder = { path = "../iron-canvas-recorder", optional = true }
serde_json = { version = "1", optional = true }
ironcalc_base = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement","OffscreenCanvas",
    "TextMetrics",
    "Window","Element", "Document", "CssStyleDeclaration"
] }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
bitflags = {workspace = true}
iron-canvas-canvas2d = { version = "0.1.0-beta.2", path = "../iron-canvas-canvas2d" }
