[package]
name = "iron-canvas-datagrid-web"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iron-canvas-core = { path = "../iron-canvas-core" }
iron-canvas-datagrid = { path = "../iron-canvas-datagrid" }
iron-canvas-canvas2d = { path = "../iron-canvas-canvas2d" }
iron-canvas-export = { path = "../iron-canvas-export" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement","Element","Window","Document"] }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
iron-canvas-recorder = { path = "../iron-canvas-recorder" }
iron-canvas-core = { path = "../iron-canvas-core", features = ["surface-introspection"] }
wasm-bindgen-test = "0.3"
