[package]
name = "rusty-calc"
version = "0.1.0-alpha.5"
edition = "2024"
repository = "https://github.com/CoalUnicorn/RustyCalc"
homepage = "https://coalunicorn.github.io/RustyCalc/"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
ironcalc_base = { version = "0.7.1", path = "IronCalc/base"  }
ironcalc = { version = "0.7.1", path = "IronCalc/xlsx" }
iron-canvas-web = { path = "iron-canvas/crates/iron-canvas-web" }
iron-canvas-core = { path = "iron-canvas/crates/iron-canvas-core" }
iron-canvas-ironcalc = { path = "iron-canvas/crates/iron-canvas-ironcalc" }


web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlCanvasElement", "HtmlElement",
    "CanvasRenderingContext2d", "TextMetrics", "Element",
    "KeyboardEvent", "MouseEvent", "WheelEvent",
    "Clipboard", "Navigator",
    "HtmlInputElement", "HtmlTextAreaElement",
    "Crypto", "DomStringMap", "Performance",
    "File", "FileList", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement",
    "FontFaceSet",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-storage = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
leptos-use = "0.19"
js-sys = "0.3"  # For enhanced storage date/time functions
thiserror = "2.0"  # For structured error types
sha2 = { version = "0.11.0", default-features = false }
iron-canvas-datagrid = { version = "0.1.0-beta.2", path = "iron-canvas/crates/iron-canvas-datagrid" }
iron-canvas-canvas2d = { version = "0.1.0-beta.2", path = "iron-canvas/crates/iron-canvas-canvas2d" }

[dev-dependencies]
wasm-bindgen-test = "0.3"
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
tauri = []
dev-tools = ["iron-canvas-web/dev-tools", "export"]
export = ["iron-canvas-web/pdf"]
