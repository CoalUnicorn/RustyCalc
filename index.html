<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RustyCalc</title>
        <link data-trunk rel="copy-dir" href="styles" />
        <link rel="stylesheet" href="styles/index.css" />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, sans-serif;
                overflow: hidden;
            }

            :root {
                --bg-primary: #fff;
                --bg-secondary: #f5f5f5;
                --bg-hover: rgba(0, 0, 0, 0.06);
                --border-color: #d9d9d9;
                --border-inner: #e0e0e0;
                --text-primary: #444;
                --text-dim: #666;
                --text-strong: #333;
                --text-secondary: #555;
                --text-placeholder: #999;
                --accent: #1976d2;
                --btn-bg: #f5f5f5;
                --tab-active-bg: #fff;
                --cell-editor-bg: #fff;

                /* iron-canvas palette (upstream IronCalc CSS-var contract).
                   Read by `IronCanvas::set_theme_from_element` via
                   `getComputedStyle(<html>)`. Light values; dark overrides
                   in the `[data-theme="dark"]` block below. */
                --palette-common-white: #ffffff;
                --palette-sheet-grid-color: #e0e0e0;
                --palette-sheet-grid-separator-color: #e0e0e0;
                --palette-sheet-header-background: #ffffff;
                --palette-sheet-header-border-color: #e0e0e0;
                --palette-sheet-header-text-color: #333333;
                --palette-sheet-header-selected-background: #eeeeee;
                --palette-sheet-header-selected-color: #333333;
                --palette-sheet-default-text-color: #2e414d;
                --palette-error-main: #cc0000;
                --palette-primary-main: #1e6fd9;
            }

            [data-theme="dark"] {
                --bg-primary: #1e1e1e;
                --bg-secondary: #2a2a2a;
                --bg-hover: rgba(255, 255, 255, 0.08);
                --border-color: #3a3a3a;
                --border-inner: #3a3a3a;
                --text-primary: #ccc;
                --text-dim: #888;
                --text-strong: #ddd;
                --text-secondary: #aaa;
                --text-placeholder: #666;
                --accent: #4da3e8;
                --btn-bg: #2d2d2d;
                --tab-active-bg: #2d2d2d;
                --cell-editor-bg: #1e1e1e;

                /* iron-canvas palette overrides for dark mode. */
                --palette-common-white: #121212;
                --palette-sheet-grid-color: #3a3a3a;
                --palette-sheet-grid-separator-color: #3a3a3a;
                --palette-sheet-header-background: #1e1e1e;
                --palette-sheet-header-border-color: #3a3a3a;
                --palette-sheet-header-text-color: #cccccc;
                --palette-sheet-header-selected-background: #2d2d2d;
                --palette-sheet-header-selected-color: #cccccc;
                --palette-sheet-default-text-color: #d4d4d4;
                --palette-error-main: #ff6b6b;
                /* --palette-primary-main inherits from :root (theme-agnostic accent). */
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
